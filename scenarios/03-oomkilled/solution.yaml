apiVersion: v1
kind: Namespace
metadata:
  name: lab-03
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  namespace: lab-03
spec:
  replicas: 1
  selector:
    matchLabels: {app: worker}
  template:
    metadata:
      labels: {app: worker}
    spec:
      containers:
        - name: worker
          image: busybox:1.36
          command: ["sh", "-c"]
          args:
            - |
              # Simula una carga que necesita decenas de MiB de memoria
              x=a; i=0
              while [ $i -lt 25 ]; do x="$x$x"; i=$((i+1)); done
              echo "carga cargada en memoria"
              sleep 3600
          resources:
            requests: {cpu: 10m, memory: 16Mi}
            limits: {memory: 256Mi}
