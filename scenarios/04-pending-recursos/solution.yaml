apiVersion: v1
kind: Namespace
metadata:
  name: lab-04
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: batch
  namespace: lab-04
spec:
  replicas: 1
  selector:
    matchLabels: {app: batch}
  template:
    metadata:
      labels: {app: batch}
    spec:
      containers:
        - name: batch
          image: busybox:1.36
          command: ["sleep", "3600"]
          resources:
            requests: {cpu: 100m, memory: 64Mi}
            limits: {memory: 64Mi}
