apiVersion: v1
kind: Namespace
metadata:
  name: lab-13
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: data
  namespace: lab-13
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 100Mi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: db
  namespace: lab-13
spec:
  replicas: 1
  selector:
    matchLabels: {app: db}
  template:
    metadata:
      labels: {app: db}
    spec:
      containers:
        - name: db
          image: busybox:1.36
          command: ["sh", "-c", "echo datos > /data/prueba.txt && echo escritura-ok; sleep 3600"]
          volumeMounts:
            - name: data
              mountPath: /data
          resources:
            requests: {cpu: 10m, memory: 16Mi}
            limits: {memory: 64Mi}
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: data
