apiVersion: v1
kind: Namespace
metadata:
  name: lab-11
---
apiVersion: v1
kind: Secret
metadata:
  name: db-credentials
  namespace: lab-11
type: Opaque
stringData:
  db-password: valor-de-ejemplo-no-real
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: app
  namespace: lab-11
spec:
  replicas: 1
  selector:
    matchLabels: {app: app}
  template:
    metadata:
      labels: {app: app}
    spec:
      containers:
        - name: app
          image: busybox:1.36
          command: ["sh", "-c", "test -n \"$DB_PASSWORD\" && echo credenciales-recibidas; sleep 3600"]
          env:
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: db-credentials
                  key: db-password
          resources:
            requests: {cpu: 10m, memory: 16Mi}
            limits: {memory: 64Mi}
