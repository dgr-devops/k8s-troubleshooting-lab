apiVersion: v1
kind: Namespace
metadata:
  name: lab-14
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: pod-reader
  namespace: lab-14
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: watcher
  namespace: lab-14
spec:
  replicas: 1
  selector:
    matchLabels: {app: watcher}
  template:
    metadata:
      labels: {app: watcher}
    spec:
      serviceAccountName: pod-reader
      containers:
        - name: watcher
          image: curlimages/curl:8.10.1
          command: ["sh", "-c"]
          args:
            - |
              SA=/var/run/secrets/kubernetes.io/serviceaccount
              while true; do
                code=$(curl -s -o /tmp/body -w '%{http_code}' --cacert $SA/ca.crt \
                  -H "Authorization: Bearer $(cat $SA/token)" \
                  https://kubernetes.default.svc/api/v1/namespaces/lab-14/pods)
                echo "HTTP $code $(head -c 200 /tmp/body | tr -d '\n' | tr -s ' ')"
                sleep 3
              done
          resources:
            requests: {cpu: 10m, memory: 16Mi}
            limits: {memory: 64Mi}
