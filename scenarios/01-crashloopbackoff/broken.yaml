apiVersion: v1
kind: Namespace
metadata:
  name: lab-01
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: lab-01
spec:
  replicas: 1
  selector:
    matchLabels: {app: api}
  template:
    metadata:
      labels: {app: api}
    spec:
      containers:
        - name: api
          image: busybox:1.36
          command: ["sh", "-c"]
          args:
            - |
              if [ -z "$DATABASE_URL" ]; then
                echo "FATAL: la variable DATABASE_URL no está definida" >&2
                exit 1
              fi
              echo "conectando a $DATABASE_URL"
              sleep 3600
          resources:
            requests: {cpu: 10m, memory: 16Mi}
            limits: {memory: 64Mi}
