apiVersion: v1
kind: Namespace
metadata:
  name: lab-05
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cache
  namespace: lab-05
spec:
  replicas: 1
  selector:
    matchLabels: {app: cache}
  template:
    metadata:
      labels: {app: cache}
    spec:
      containers:
        - name: cache
          image: busybox:1.36
          command: ["sleep", "3600"]
          resources:
            requests: {cpu: 10m, memory: 16Mi}
            limits: {memory: 64Mi}
