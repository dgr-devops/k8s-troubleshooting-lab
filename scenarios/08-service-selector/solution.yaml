apiVersion: v1
kind: Namespace
metadata:
  name: lab-08
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: lab-08
spec:
  replicas: 2
  selector:
    matchLabels: {app: web}
  template:
    metadata:
      labels: {app: web}
    spec:
      containers:
        - name: web
          image: nginx:1.27-alpine
          ports:
            - containerPort: 80
          resources:
            requests: {cpu: 10m, memory: 16Mi}
            limits: {memory: 128Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: lab-08
spec:
  selector:
    app: web
  ports:
    - port: 80
      targetPort: 80
