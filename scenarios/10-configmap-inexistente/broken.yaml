apiVersion: v1
kind: Namespace
metadata:
  name: lab-10
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: app
  namespace: lab-10
spec:
  replicas: 1
  selector:
    matchLabels: {app: app}
  template:
    metadata:
      labels: {app: app}
    spec:
      containers:
        - name: app
          image: busybox:1.36
          command: ["sh", "-c", "echo LOG_LEVEL=$LOG_LEVEL; sleep 3600"]
          env:
            - name: LOG_LEVEL
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: log_level
          resources:
            requests: {cpu: 10m, memory: 16Mi}
            limits: {memory: 64Mi}
