apiVersion: v1
kind: Namespace
metadata:
  name: lab-12
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: lab-12
spec:
  replicas: 1
  selector:
    matchLabels: {app: web}
  template:
    metadata:
      labels: {app: web}
    spec:
      containers:
        - name: web
          image: nginx:1.27-alpine
          ports:
            - containerPort: 80
          resources:
            requests: {cpu: 10m, memory: 16Mi}
            limits: {memory: 128Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: lab-12
spec:
  selector: {app: web}
  ports:
    - port: 80
      targetPort: 80
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: client
  namespace: lab-12
spec:
  replicas: 1
  selector:
    matchLabels: {app: client}
  template:
    metadata:
      labels: {app: client}
    spec:
      containers:
        - name: client
          image: busybox:1.36
          command: ["sh", "-c"]
          args:
            - |
              while true; do
                if out=$(wget -T 2 -O /dev/null http://web 2>&1); then
                  echo "OK: web responde"
                else
                  echo "FAIL: $(echo "$out" | tail -n 1)"
                fi
                sleep 2
              done
          resources:
            requests: {cpu: 10m, memory: 16Mi}
            limits: {memory: 64Mi}
---
# Política "deny all" de salida para el cliente: ni siquiera puede resolver DNS
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: client-egress
  namespace: lab-12
spec:
  podSelector:
    matchLabels: {app: client}
  policyTypes: [Egress]
  egress: []
