apiVersion: v1
kind: Namespace
metadata:
  name: lab-02
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: lab-02
spec:
  replicas: 1
  selector:
    matchLabels: {app: web}
  template:
    metadata:
      labels: {app: web}
    spec:
      containers:
        - name: web
          image: nginx:1.27-alpne
          resources:
            requests: {cpu: 10m, memory: 16Mi}
            limits: {memory: 128Mi}
